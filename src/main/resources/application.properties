spring.application.name=Medicitas
server.port=8080

# Permite cargar credenciales locales desde un archivo .env no versionado.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL: configurar estas variables en el entorno local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medicitas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

vaadin.launch-browser=true
