services:
  - type: web
    name: medicitas
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/medicitas-0.0.1-SNAPSHOT.jar
    healthCheckPath: /login
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: update
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: DOCTOR_INITIAL_PASSWORD
        generateValue: true
