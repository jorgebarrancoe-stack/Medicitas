services:
  - type: web
    name: medicitas
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: update
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: DOCTOR_INITIAL_PASSWORD
        generateValue: true
